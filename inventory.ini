# Inventaire Ansible — TP Cloud Computing
# Réseau privé VirtualBox : 192.168.56.0/24

[master]
master ansible_host=192.168.56.10

[cluster1]
cluster1-node1 ansible_host=192.168.56.11
cluster1-node2 ansible_host=192.168.56.12
cluster1-node3 ansible_host=192.168.56.13

[cluster2]
cluster2-node1 ansible_host=192.168.56.21
cluster2-node2 ansible_host=192.168.56.22
cluster2-node3 ansible_host=192.168.56.23

# Groupes fonctionnels (utilisés par les playbooks)
[webservers_nginx:children]
cluster1

[webservers_apache:children]
cluster2

[monitoring:children]
master

[security:children]
master

[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
