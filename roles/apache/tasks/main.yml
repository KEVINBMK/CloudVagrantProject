---
# Rôle Apache — installation et déploiement du site Cluster 2
- name: Installer Apache2
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true

- name: Installer le module PHP pour Apache
  ansible.builtin.apt:
    name: "libapache2-mod-php{{ php_version }}"
    state: present

- name: Créer le répertoire de déploiement de l'application
  ansible.builtin.file:
    path: "{{ app_deploy_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Déployer l'application PHP sur le site
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../apps/cluster2-apache-app/"
    dest: "{{ app_deploy_path }}/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"

- name: Installer le VirtualHost Apache
  ansible.builtin.template:
    src: apache-vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ app_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart apache

- name: Désactiver le site Apache par défaut
  ansible.builtin.command: a2dissite 000-default.conf
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Restart apache

- name: Activer le site Apache du cluster 2
  ansible.builtin.command: "a2ensite {{ app_name }}.conf"
  args:
    creates: "/etc/apache2/sites-enabled/{{ app_name }}.conf"
  notify: Restart apache

- name: Démarrer et activer Apache2
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
