---
# Rôle PHP — partagé Cluster 1 (Nginx) et Cluster 2 (Apache)
- name: Installer les paquets PHP requis
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-common"
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-mbstring"
    state: present
    update_cache: true

- name: Démarrer et activer PHP-FPM
  ansible.builtin.service:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true
